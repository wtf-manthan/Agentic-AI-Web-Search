<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Search Agent</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@300;400;500;600&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
    <!-- Marked.js for Markdown rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Minimal Top Navbar -->
        <header class="navbar">
            <div class="brand">
                <div class="brand-logo">WS</div>
                <div class="brand-text">
                    <h1>Web Search Agent</h1>
                </div>
            </div>
            <div class="nav-controls">
                <div class="status-pill" id="health-status">
                    <span class="pulse-dot"></span>
                    <span class="status-text">System Online</span>
                </div>
                <button class="btn btn-secondary" id="new-session-btn">
                    <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><path d="M12 5v14M5 12h14"/></svg>
                    New Chat
                </button>
            </div>
        </header>

        <!-- Minimalist Centered Workspace -->
        <main class="chat-area">
            <div class="chat-messages" id="chat-messages">
                <!-- Welcome Message -->
                <div class="message agent-message">
                    <div class="avatar agent-avatar">WS</div>
                    <div class="message-content">
                        <div class="markdown-body">
                            <p><strong>Welcome to Web Search Agent.</strong></p>
                            <p>Ask any question to search the web, extract deep page content, and generate synthesized answers with multi-turn conversational memory.</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Floating Centered Input Bar -->
            <div class="input-panel">
                <form id="chat-form" class="chat-form">
                    <div class="input-wrapper">
                        <input 
                            type="text" 
                            id="user-input" 
                            placeholder="Ask anything..." 
                            autocomplete="off"
                            required
                        >
                        <button type="submit" class="btn btn-primary" id="send-btn" aria-label="Send">
                            <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                        </button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
